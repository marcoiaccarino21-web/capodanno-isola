<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171C36">
<title>Capodanno a Isola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..800;1,400..700&family=DM+Sans:wght@400..700&display=swap">
<style>
/* Una colonna da telefono: notte blu, oro solo per le cose che contano (la tua squadra, le buste) */
:root{
  --night:#171C36; --night-2:#222A4D; --night-3:#2E3768; --line:#343C66;
  --cream:#F7F2E8; --muted:#C9CCDB; --faint:#9DA2BC;
  --gold:#E2B04A; --gold-2:#F0CF7A; --coral:#E8735A; --ok:#8FC79A;
  --display:'Fraunces', Georgia, serif; --body:'DM Sans', 'Segoe UI', Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 80% -10%, var(--night-3) 0%, var(--night) 60%) fixed, var(--night);color:var(--cream);font:16px/1.5 var(--body);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px;padding:8px 0 4px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,10vw,48px);line-height:1;margin:0}
h1 em{color:var(--gold);font-weight:600}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0;font-weight:700}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.small{color:var(--faint);font-size:13px}
.box{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.box.gold h3{color:#4A3A12}.box.gold .sub{color:#2A2F45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--gold);color:var(--night);border:0;font:700 15px var(--body);padding:12px 18px;border-radius:12px;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.big{width:100%;font-size:17px;padding:16px}
.btn.danger{background:var(--coral);color:var(--night)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
input[type=text],input[type=password]{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--cream);font:500 16px var(--body);padding:12px 14px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--night-3);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}
.chip button{background:none;border:0;color:var(--muted);font-size:16px;padding:2px 8px;cursor:pointer;min-height:32px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{color:var(--gold);font-size:14px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.name{background:var(--night-2);border:1px solid var(--line);color:var(--cream);border-radius:14px;padding:16px 12px;font:700 16px var(--body);text-align:left;cursor:pointer;overflow-wrap:anywhere;min-height:56px}
.team{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team strong{font-family:var(--display);font-size:20px}
.mine{color:var(--gold)}
.big-dish{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05}
.nominees{display:flex;flex-direction:column;gap:10px}
.nominee{background:var(--night-2);border:1px solid var(--line);color:var(--cream);border-radius:14px;padding:16px;font:600 17px var(--body);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.nominee small{color:var(--muted);font-weight:500;font-size:13px}
.nominee[aria-pressed="true"]{border-color:var(--gold);background:var(--night-3);box-shadow:inset 0 0 0 1px var(--gold)}
.step{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;font-variant-numeric:tabular-nums}
.summary div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.summary div span:last-child{font-weight:700;text-align:right}
.envelope{background:linear-gradient(160deg,var(--night-3),var(--night-2));border:1px solid var(--gold);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.winner{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;color:var(--gold-2);text-wrap:balance}
.tally div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px;margin-top:6px}
.bar{grid-column:1 / -1;height:4px;background:var(--night);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.count{font-variant-numeric:tabular-nums;color:var(--muted)}
.meter{height:6px;background:var(--night);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.warn{background:#4A2A12;border:1px solid #7A4A1E;color:#F3D9B5;border-radius:12px;padding:12px 14px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(23,28,54,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--n,3),1fr);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));z-index:10}
nav.tabs button{background:none;border:0;color:var(--faint);font:700 12px var(--body);padding:10px 2px;border-radius:12px;cursor:pointer;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--night);background:var(--gold)}
.reveal{animation:rise .7s ease both}
@keyframes rise{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <p class="eyebrow">Isola Sant’Antonio · 30.12 – 1.1</p>
    <h1>Capodanno <em>a Isola</em></h1>
  </header>
  <p class="sub">Caricamento…</p>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<script type="module" src="./app.js"></script>
</body>
</html>
